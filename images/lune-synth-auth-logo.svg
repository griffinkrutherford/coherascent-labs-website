<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="auth-title auth-desc">
  <title id="auth-title">Lune Synth Auth Logo</title>
  <desc id="auth-desc">A glowing, glassmorphic 120x120 logo for Lune Synth authentication featuring a crescent moon and keyhole motif.</desc>
  
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a47bff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#64a8ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glassmorphic Card Background -->
    <linearGradient id="glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1528" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050914" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glassmorphic Border Gradient -->
    <linearGradient id="glass-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#64a8ff" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#a47bff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ff5d87" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Moon Neon Gradient -->
    <linearGradient id="moon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64a8ff"/>   <!-- Cyan -->
      <stop offset="50%" stop-color="#a47bff"/>  <!-- Purple -->
      <stop offset="100%" stop-color="#ff5d87"/> <!-- Pink -->
    </linearGradient>

    <!-- Auth Keyhole Glow Gradient -->
    <radialGradient id="key-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#64a8ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a47bff" stop-opacity="0.4"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Moon Mask for clean crescent geometry -->
    <mask id="crescent-mask">
      <rect x="0" y="0" width="120" height="120" fill="white"/>
      <circle cx="66" cy="52" r="23" fill="black"/>
    </mask>
  </defs>

  <!-- Base Glow -->
  <circle cx="60" cy="60" r="50" fill="url(#bg-glow)"/>

  <!-- Outer Glassmorphic Circle -->
  <circle cx="60" cy="60" r="46" fill="url(#glass-bg)" stroke="url(#glass-border)" stroke-width="1.5"/>

  <!-- Decorative Constellation Lines (Synth vibe) -->
  <g stroke="rgba(100, 168, 255, 0.2)" stroke-width="0.75" opacity="0.8">
    <line x1="32" y1="52" x2="48" y2="38"/>
    <line x1="48" y1="38" x2="72" y2="34"/>
    <line x1="32" y1="52" x2="44" y2="76"/>
    <line x1="44" y1="76" x2="68" y2="82"/>
  </g>
  
  <!-- Constellation Nodes -->
  <g fill="#64a8ff" opacity="0.6">
    <circle cx="32" cy="52" r="1.5" filter="url(#subtle-glow)"/>
    <circle cx="48" cy="38" r="1.5" filter="url(#subtle-glow)"/>
    <circle cx="72" cy="34" r="1.2"/>
    <circle cx="44" cy="76" r="1.5" filter="url(#subtle-glow)"/>
    <circle cx="68" cy="82" r="1.2"/>
  </g>

  <!-- Glowing Crescent Moon -->
  <circle cx="56" cy="60" r="26" fill="url(#moon-grad)" mask="url(#crescent-mask)" filter="url(#neon-glow)"/>

  <!-- Auth Keyhole -->
  <g filter="url(#neon-glow)">
    <!-- Keyhole Shape centered at (62, 60) -->
    <path d="M 62,50 
             A 6,6 0 0,0 56.2,58.8 
             L 54.5,69.5 
             A 1.5,1.5 0 0,0 56,71.2 
             H 68 
             A 1.5,1.5 0 0,0 69.5,69.5 
             L 67.8,58.8 
             A 6,6 0 0,0 62,50 Z" 
          fill="url(#key-glow)"/>
    <!-- Center Keyhole Cutout -->
    <circle cx="62" cy="56" r="2.2" fill="#080d1a"/>
    <polygon points="61.2,57 62.8,57 63.3,64 60.7,64" fill="#080d1a"/>
  </g>

  <!-- Foreground Highlights -->
  <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
</svg>
