<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="title desc">
  <title id="title">Applied hero sphere</title>
  <desc id="desc">Standalone export of the sphere used at the top of the applied section.</desc>
  <defs>
    <radialGradient id="base-sphere" cx="38%" cy="34%" r="78%">
      <stop offset="0%" stop-color="rgb(206, 188, 255)" stop-opacity="0.99"/>
      <stop offset="34%" stop-color="rgb(151, 126, 226)" stop-opacity="0.99"/>
      <stop offset="70%" stop-color="rgb(96, 110, 198)" stop-opacity="0.99"/>
      <stop offset="100%" stop-color="rgb(46, 54, 110)" stop-opacity="0.99"/>
    </radialGradient>
    <radialGradient id="sphere-fill" cx="34%" cy="34%" r="72%">
      <stop offset="0%" stop-color="rgb(255,255,255)" stop-opacity="0.78"/>
      <stop offset="18%" stop-color="rgb(255,93,135)" stop-opacity="0.62"/>
      <stop offset="42%" stop-color="rgb(180,116,226)" stop-opacity="0.48"/>
      <stop offset="64%" stop-color="rgb(100,168,255)" stop-opacity="0.30"/>
      <stop offset="82%" stop-color="rgb(62,84,160)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="rgb(32,44,90)" stop-opacity="0.10"/>
    </radialGradient>
    <radialGradient id="red-blush" cx="31%" cy="31%" r="42%">
      <stop offset="0%" stop-color="rgb(255, 204, 214)" stop-opacity="0.48"/>
      <stop offset="28%" stop-color="rgb(255, 120, 150)" stop-opacity="0.44"/>
      <stop offset="56%" stop-color="rgb(255, 93, 135)" stop-opacity="0.24"/>
      <stop offset="78%" stop-color="rgb(255, 93, 135)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="rgb(255, 93, 135)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue-glow" cx="65%" cy="70%" r="58%">
      <stop offset="0%" stop-color="rgb(100,168,255)" stop-opacity="0.18"/>
      <stop offset="55%" stop-color="rgb(100,168,255)" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="rgb(100,168,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular-highlight" cx="30%" cy="28%" r="24%">
      <stop offset="0%" stop-color="rgb(255,255,255)" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="rgb(255,255,255)" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="rgb(255,255,255)" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inner-shade" cx="82%" cy="78%" r="56%">
      <stop offset="42%" stop-color="rgb(5,10,22)" stop-opacity="0"/>
      <stop offset="100%" stop-color="rgb(5,10,22)" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="sphere-clip">
      <circle cx="160" cy="160" r="110"/>
    </clipPath>
  </defs>

  <circle cx="160" cy="160" r="110" fill="url(#base-sphere)"/>
  <circle cx="160" cy="160" r="110" fill="url(#sphere-fill)"/>
  <circle cx="160" cy="160" r="110" fill="url(#red-blush)"/>
  <circle cx="160" cy="160" r="110" fill="url(#blue-glow)"/>
  <circle cx="160" cy="160" r="110" fill="url(#specular-highlight)"/>
  <g clip-path="url(#sphere-clip)">
    <circle cx="160" cy="160" r="110" fill="url(#inner-shade)"/>
  </g>
</svg>
